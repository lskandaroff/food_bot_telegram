services:
  - type: web
    name: food-bot-app
    env: python
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && chmod +x start.sh && ./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BOT_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DELIVERY_PERSON_ID
        value: "779171993"
